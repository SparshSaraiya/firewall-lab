<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Egress filtering: watch what goes OUT too</text>

  <rect x="40" y="70" width="150" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="115" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">SERVER</text>
  <text x="115" y="130" text-anchor="middle" font-size="12" fill="#14532d">(imagine it got hacked)</text>

  <rect x="305" y="60" width="150" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="380" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">FIREWALL</text>
  <text x="380" y="130" text-anchor="middle" font-size="12" fill="#7f1d1d">outbound allow-list:</text>
  <text x="380" y="148" text-anchor="middle" font-size="12" fill="#7f1d1d">udp/53, tcp/443 only</text>

  <rect x="570" y="70" width="150" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="645" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">OUTSIDE</text>
  <text x="645" y="130" text-anchor="middle" font-size="12" fill="#0c4a6e">attacker's computer</text>

  <line x1="190" y1="90" x2="305" y2="90" stroke="#b91c1c" stroke-width="2"/>
  <text x="248" y="82" text-anchor="middle" font-size="11" fill="#b91c1c">port 4444</text>
  <text x="248" y="106" text-anchor="middle" font-size="16" fill="#b91c1c">X</text>
  <line x1="190" y1="140" x2="305" y2="140" stroke="#15803d" stroke-width="2"/>
  <text x="248" y="132" text-anchor="middle" font-size="11" fill="#15803d">port 443</text>
  <line x1="455" y1="140" x2="570" y2="140" stroke="#15803d" stroke-width="2"/>

  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#374151">Without egress rules the "reverse shell" on :4444 connected. With them it was blocked.</text>
  <text x="380" y="235" text-anchor="middle" font-size="13" fill="#374151">Gap that remains: 443 to anywhere still allows hiding bad traffic in HTTPS.</text>
  <text x="380" y="260" text-anchor="middle" font-size="13" fill="#374151">Fix: only allow 443 to named destinations, or force a proxy.</text>
</svg>
